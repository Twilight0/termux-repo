name: Build and Deploy APT Repository

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gcc-aarch64-linux-gnu

      - name: Create output directory
        run: mkdir -p debs

      # --- wrangler (architecture-independent) ---
      - name: Build wrangler
        run: dpkg-deb -Zxz --build packages/wrangler debs/

      # --- muse-code (both architectures) ---
      - name: Build muse-code (aarch64)
        run: bash packages/muse-code/build.sh aarch64
      - name: Build muse-code (x86_64)
        run: bash packages/muse-code/build.sh x86_64

      # --- opencode (glibc, both architectures) ---
      - name: Build opencode (aarch64)
        run: bash packages/opencode/build.sh aarch64
      - name: Build opencode (x86_64)
        run: bash packages/opencode/build.sh x86_64

      # --- antigravity-cli (glibc, both architectures) ---
      - name: Build antigravity-cli (aarch64)
        run: bash packages/antigravity-cli/build.sh aarch64
      - name: Build antigravity-cli (x86_64)
        run: bash packages/antigravity-cli/build.sh x86_64

      # --- oh-my-pi (glibc, both architectures) ---
      - name: Build oh-my-pi (aarch64)
        run: bash packages/oh-my-pi/build.sh aarch64
      - name: Build oh-my-pi (x86_64)
        run: bash packages/oh-my-pi/build.sh x86_64

      - name: List built packages
        run: ls -lh debs/

      - name: Generate APT repository metadata
        run: bash scripts/generate-repo.sh

      - name: Deploy debs to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

          gh release create latest \
            --title "Latest Build" \
            --notes "Automated build from $(git rev-parse --short HEAD)" \
            --target main

          gh release upload latest debs/*.deb --clobber

          echo "Release created:"
          gh release view latest --repo ${{ github.repository }}

      - name: Deploy metadata to gh-pages
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git fetch origin gh-pages --depth=1 2>/dev/null; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
            touch .nojekyll
            git add .nojekyll
            git commit -m "Init gh-pages"
            git push origin gh-pages
          fi

          git rm -rf dists/ 2>/dev/null || true

          # Copy only metadata, skip .deb files (those are on Releases)
          mkdir -p dists/stable/main
          for arch_dir in repo/dists/stable/main/binary-*; do
            arch=$(basename "$arch_dir")
            mkdir -p "dists/stable/main/${arch}"
            cp "$arch_dir"/Packages* "dists/stable/main/${arch}/"
          done
          cp repo/dists/stable/Release dists/stable/

          touch .nojekyll

          git add dists/ .nojekyll
          git commit -m "Deploy repo metadata $(date -u +%Y-%m-%d)" || true
          git push origin gh-pages

          echo "gh-pages deploy complete!"
