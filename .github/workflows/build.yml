name: Build and Deploy APT Repository

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # weekly on Sunday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gcc-aarch64-linux-gnu

      - name: Create output directories
        run: mkdir -p debs

      # --- wrangler (architecture-independent) ---
      - name: Build wrangler
        run: dpkg-deb -Zxz --build packages/wrangler debs/

      # --- muse-code (both architectures) ---
      - name: Build muse-code (aarch64)
        run: bash packages/muse-code/build.sh aarch64
      - name: Build muse-code (x86_64)
        run: bash packages/muse-code/build.sh x86_64

      # --- opencode (glibc, both architectures) ---
      - name: Build opencode (aarch64)
        run: bash packages/opencode/build.sh aarch64
      - name: Build opencode (x86_64)
        run: bash packages/opencode/build.sh x86_64

      # --- antigravity-cli (glibc, both architectures) ---
      - name: Build antigravity-cli (aarch64)
        run: bash packages/antigravity-cli/build.sh aarch64
      - name: Build antigravity-cli (x86_64)
        run: bash packages/antigravity-cli/build.sh x86_64

      # --- oh-my-pi (glibc, both architectures) ---
      - name: Build oh-my-pi (aarch64)
        run: bash packages/oh-my-pi/build.sh aarch64
      - name: Build oh-my-pi (x86_64)
        run: bash packages/oh-my-pi/build.sh x86_64

      - name: List built packages
        run: ls -lh debs/

      - name: Generate APT repository metadata
        run: |
          set -e
          DIST="stable"
          COMP="main"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/latest"

          mkdir -p "repo/dists/${DIST}/${COMP}"

          # Copy debs into repo structure for Packages generation
          for deb in debs/*.deb; do
            arch=$(dpkg-deb -f "$deb" Architecture)
            mkdir -p "repo/dists/${DIST}/${COMP}/binary-${arch}"
            cp "$deb" "repo/dists/${DIST}/${COMP}/binary-${arch}/"
          done

          for arch_dir in repo/dists/${DIST}/${COMP}/binary-*; do
            arch=$(basename "$arch_dir" | sed 's/binary-//')
            echo "Generating Packages for ${arch}..."
            cd "$arch_dir"

            first=1
            for deb in *.deb; do
              control=$(dpkg-deb -I "$deb")
              pkg=$(echo "$control" | grep '^Package:' | awk '{print $2}')
              ver=$(echo "$control" | grep '^Version:' | awk '{print $2}')
              desc=$(echo "$control" | grep '^Description:' | sed 's/^Description: //')
              depends=$(echo "$control" | grep '^Depends:' | sed 's/^Depends: //')
              maint=$(echo "$control" | grep '^Maintainer:' | sed 's/^Maintainer: //')
              section=$(echo "$control" | grep '^Section:' | awk '{print $2}')
              priority=$(echo "$control" | grep '^Priority:' | awk '{print $2}')
              homepage=$(echo "$control" | grep '^Homepage:' | sed 's/^Homepage: //')
              size=$(stat -c%s "$deb")
              md5=$(md5sum "$deb" | cut -d' ' -f1)
              sha1=$(sha1sum "$deb" | cut -d' ' -f1)
              sha256=$(sha256sum "$deb" | cut -d' ' -f1)
              # Filename: deb filename only — release assets are flat
              filename="${RELEASE_URL}/${deb}"

              if [ "$first" -eq 1 ]; then
                first=0
              else
                echo "" >> Packages
              fi

              cat >> Packages <<PKGENTRY
          Package: ${pkg}
          Version: ${ver}
          Architecture: ${arch}
          Maintainer: ${maint}
          Installed-Size: $(($(stat -c%s "$deb") / 1024))
          Depends: ${depends}
          Section: ${section}
          Priority: ${priority}
          Homepage: ${homepage}
          Description: ${desc}
         Filename: ${filename}
          Size: ${size}
          MD5sum: ${md5}
          SHA1: ${sha1}
          SHA256: ${sha256}
          PKGENTRY
            done
            sed -i 's/^          //' Packages
            xz -9kf Packages
            cd -
          done

          # Generate Release file
          RELEASE="repo/dists/${DIST}/Release"
          {
            echo "Origin: Twilight"
            echo "Label: termux-repo"
            echo "Codename: ${DIST}"
            echo "Architectures: $(ls -d repo/dists/${DIST}/${COMP}/binary-* | xargs -I{} basename {} | sed 's/binary-//' | sort | tr '\n' ' ')"
            echo "Components: ${COMP}"
            echo "Description: Twilight custom termux repository"
            echo "Suite: ${DIST}"
            echo "Date: $(date -Ru)"

            for arch_dir in repo/dists/${DIST}/${COMP}/binary-*; do
              arch=$(basename "$arch_dir" | sed 's/binary-//')
              for f in Packages Packages.xz; do
                filepath="${arch_dir}/${f}"
                if [ -f "$filepath" ]; then
                  hash=$(sha256sum "$filepath" | cut -d' ' -f1)
                  size=$(stat -c%s "$filepath")
                  echo " ${hash} ${size} ${COMP}/binary-${arch}/${f}"
                fi
              done
            done
          } > "${RELEASE}"

          echo "Repository metadata generated:"
          find repo/ -type f | sort

      - name: Deploy debs to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # Delete old 'latest' release
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

          # Create new 'latest' release
          gh release create latest \
            --title "Latest Build" \
            --notes "Automated build from $(git rev-parse --short HEAD)" \
            --target main

          # Upload all debs (2GB per file limit on releases)
          echo "Uploading debs to release..."
          gh release upload latest debs/*.deb --clobber

          echo "Release created!"
          gh release view latest --repo ${{ github.repository }}

      - name: Deploy metadata to gh-pages
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Prepare gh-pages branch
          if git fetch origin gh-pages --depth=1 2>/dev/null; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
            touch .nojekyll
            git add .nojekyll
            git commit -m "Init gh-pages"
            git push origin gh-pages
          fi

          # Clear old metadata
          git rm -rf dists/ 2>/dev/null || true

          # Copy new metadata
          cp -r repo/dists .

          # Ensure .nojekyll exists
          touch .nojekyll

          git add dists/ .nojekyll
          git commit -m "Deploy repo metadata $(date -u +%Y-%m-%d)" || true
          git push origin gh-pages

          echo "gh-pages deploy complete!"
