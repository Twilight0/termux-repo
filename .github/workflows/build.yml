name: Build and Deploy APT Repository

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # weekly on Sunday
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gcc-aarch64-linux-gnu

      - name: Create output directories
        run: mkdir -p debs repo

      # --- wrangler (architecture-independent) ---
      - name: Build wrangler
        run: dpkg-deb -Zxz --build packages/wrangler debs/

      # --- muse-code (both architectures) ---
      - name: Build muse-code (aarch64)
        run: bash packages/muse-code/build.sh aarch64
      - name: Build muse-code (x86_64)
        run: bash packages/muse-code/build.sh x86_64

      # --- opencode (glibc, both architectures) ---
      - name: Build opencode (aarch64)
        run: bash packages/opencode/build.sh aarch64
      - name: Build opencode (x86_64)
        run: bash packages/opencode/build.sh x86_64

      # --- antigravity-cli (glibc + VA39 patch, both architectures) ---
      - name: Build antigravity-cli (aarch64)
        run: bash packages/antigravity-cli/build.sh aarch64
      - name: Build antigravity-cli (x86_64)
        run: bash packages/antigravity-cli/build.sh x86_64

      # --- oh-my-pi (glibc, both architectures) ---
      - name: Build oh-my-pi (aarch64)
        run: bash packages/oh-my-pi/build.sh aarch64
      - name: Build oh-my-pi (x86_64)
        run: bash packages/oh-my-pi/build.sh x86_64

      - name: List built packages
        run: ls -lh debs/

      - name: Generate APT repository
        run: |
          set -e
          DIST="stable"
          COMP="main"
          REPO_BASE="repo/dists/${DIST}/${COMP}"

          # Copy debs into arch-specific directories
          for deb in debs/*.deb; do
            arch=$(dpkg-deb -f "$deb" Architecture)
            mkdir -p "${REPO_BASE}/binary-${arch}"
            cp "$deb" "${REPO_BASE}/binary-${arch}/"
          done

          # Generate Packages + Packages.xz for each arch
          find "${REPO_BASE}" -mindepth 1 -maxdepth 1 -type d | while read arch_dir; do
            arch=$(basename "$arch_dir" | sed 's/binary-//')
            echo "Generating Packages for ${arch}..."
            dpkg-scanpackages "${arch_dir}" /dev/null 2>/dev/null > "${arch_dir}/Packages"
            xz -9kf "${arch_dir}/Packages"
          done

          # Generate Release file
          RELEASE="repo/dists/${DIST}/Release"
          cat > "${RELEASE}" << EOF
          Codename: ${DIST}
          Version: 1
          Architectures: $(ls -d ${REPO_BASE}/binary-* | xargs -I{} basename {} | sed 's/binary-//' | tr '\n' ' ')
          Components: ${COMP}
          Description: Twilight custom termux repository
          Suite: ${DIST}
          Date: $(date -Ru)
          EOF

          # Remove leading spaces (heredoc indentation)
          sed -i 's/^          //' "${RELEASE}"

          # Append checksums
          for f in $(find "${REPO_BASE}" -name 'Packages*' -type f | sort); do
            relpath=$(echo "$f" | sed 's|^repo/dists/[^/]*/||')
            for algo in md5sum sha1sum sha256sum sha512sum; do
              hash=$(${algo} "$f" | cut -d' ' -f1)
              size=$(stat -c%s "$f")
              label=$(echo ${algo} | tr '[:lower:]' '[:upper:]' | sed 's/SUM//')
              [ "${label}" = "MD5" ] && label="MD5Sum"
              echo " ${hash} ${size} ${relpath}" >> "${RELEASE}.tmp.${label}"
            done
          done

          for label in MD5Sum SHA1 SHA256 SHA512; do
            echo "${label}:" >> "${RELEASE}"
            cat "${RELEASE}.tmp.${label}" >> "${RELEASE}" 2>/dev/null || true
            rm -f "${RELEASE}.tmp.${label}"
          done

          echo "Repository generated:"
          find repo/dists -type f | head -30

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./repo
          keep_files: false
